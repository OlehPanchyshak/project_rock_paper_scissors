<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="rock">Rock</button>
    <button id="paper">Paper</button>
    <button id="scissors">Scissors</button>

   <div>Round Result:<div id="result"></div></div>
    <div>Human choice:<div id="human"></div></div>
   <div>Computer choice:<div id="computer"></div></div>
    <script>
        function getComputerChoice() {
            let randomNumber = Math.floor(Math.random() * 3);
            if (randomNumber === 0) {
                return 'Rock';
            } else if (randomNumber === 1) {
                return 'Paper';
            } else {
                return 'Scissors';
            }
        }
        function getHumanChoice() {
            let choice = prompt('Rock, paper or sicssors?');
            choice = choice.toLowerCase();
            return choice;
        }
        let humanScore = 0;
        let computerScore = 0;
      
        function playRound (humanChoice, computerChoice){
            if((humanChoice === 'Rock' && computerChoice === 'Scissors')||
             (humanChoice === 'Scissors' && computerChoice === 'Paper') || 
             (humanChoice === 'Paper' && computerChoice === 'Rock')) {
                humanScore++;
                return `You win! ${humanChoice} beats ${computerChoice}.`;
            }
            else if (humanChoice === computerChoice){
                return "It's a tie!";
            }
             else {
                computerScore++;
                return `You lose! ${computerChoice} beats ${humanChoice}.`;

            }
        }
        const humanChoice = getHumanChoice();
        const computerChoice = getComputerChoice();

    const rock = document.querySelector("#rock");

    rock.addEventListener("click", function(event){
        palyGame("Rock")
    });

   const paper = document.querySelector("#paper");

    paper.addEventListener("click", function(event){
        palyGame("Paper")
    });

   const scissors = document.querySelector("#scissors");

    scissors.addEventListener("click", function(event){
        palyGame("Scissors")
    });
    
    const result = document.querySelector("#result");
    const human = document.querySelector("#human");
    const computer = document.querySelector("#computer");


    function palyGame(humanChoice){
        human.textContent = humanChoice;
        computer.textContent = getComputerChoice();
        result.textContent = playRound(human.textContent, computer.textContent);
    }

    </script>
</body>
</html>
